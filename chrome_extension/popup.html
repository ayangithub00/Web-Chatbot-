<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Web Chatbot</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 480px;
      background: #0d0d0f;
      color: #e8e8ed;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid #1e1e24;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 13px;
      font-weight: 600;
      color: #f0f0f5;
      letter-spacing: 0.01em;
    }

    .header-text p {
      font-size: 11px;
      color: #5a5a72;
      margin-top: 1px;
    }

    .status-dot {
      margin-left: auto;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e88;
    }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      min-height: 280px;
      max-height: 320px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #3a3a50;
      text-align: center;
      padding: 40px 20px;
    }

    .empty-state .icon {
      font-size: 28px;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 12px;
      line-height: 1.6;
      color: #3a3a50;
    }

    /* Messages */
    .message {
      display: flex;
      flex-direction: column;
      gap: 2px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-items: flex-end;
    }

    .message.bot {
      align-items: flex-start;
    }

    .bubble {
      max-width: 88%;
      padding: 9px 12px;
      border-radius: 12px;
      line-height: 1.55;
      font-size: 12.5px;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      color: #fff;
      border-bottom-right-radius: 3px;
    }

    .message.bot .bubble {
      background: #18181f;
      color: #d4d4e0;
      border: 1px solid #26262f;
      border-bottom-left-radius: 3px;
    }

    .message.bot .bubble.thinking {
      color: #5a5a72;
      font-style: italic;
    }

    .bubble .dots span {
      display: inline-block;
      width: 5px;
      height: 5px;
      background: #5a5a72;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .bubble .dots span:nth-child(2) { animation-delay: 0.2s; }
    .bubble .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }

    /* ── Input area ── */
    .input-area {
      padding: 12px 16px 16px;
      border-top: 1px solid #1e1e24;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-wrap {
      flex: 1;
      background: #18181f;
      border: 1px solid #26262f;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      transition: border-color 0.15s;
    }

    .input-wrap:focus-within {
      border-color: #6c63ff55;
    }

    #question {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8e8ed;
      font-family: 'Inter', sans-serif;
      font-size: 12.5px;
      padding: 10px 0;
      resize: none;
      height: 38px;
      line-height: 1.4;
    }

    #question::placeholder {
      color: #3a3a50;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }

    .send-btn:hover {
      opacity: 0.9;
      transform: scale(1.04);
    }

    .send-btn:active {
      transform: scale(0.97);
    }

    .send-btn svg {
      width: 15px;
      height: 15px;
      fill: white;
    }

    /* ── Footer ── */
    .footer {
      padding: 6px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-left {
      font-size: 10px;
      color: #2e2e3a;
    }

    .clear-btn {
      font-size: 10px;
      color: #3a3a50;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }

    .clear-btn:hover {
      color: #6c63ff;
      background: #6c63ff11;
    }

    /* Scrollbar */
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: #26262f; border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">🤖</div>
    <div class="header-text">
      <h1>Page Chat</h1>
      <p>Ask anything about this page</p>
    </div>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="icon">💬</div>
      <p>Ask a question about the current page.<br/>I'll answer based on its content.</p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="question" placeholder="Ask about this page..." autocomplete="off" />
    </div>
    <button class="send-btn" id="askBtn" title="Send">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
      </svg>
    </button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-left">Powered by Qwen 2.5 · RAG</span>
    <button class="clear-btn" id="clearBtn">Clear chat</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
